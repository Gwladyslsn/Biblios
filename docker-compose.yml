
services:

  php-biblios:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: symfony_php_
    volumes:
      - ./app:/var/www/
    working_dir: /var/www
    depends_on:
      - db-biblios

  nginx-biblios:
    image: nginx:alpine
    container_name: symfony_nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./app:/var/www/
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-biblios

  db-biblios:
    image: mysql:8.0
    container_name: symfony_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: