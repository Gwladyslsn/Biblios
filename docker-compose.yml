
services:

  php-biblios:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: symfony_php_
    volumes:
      - ./app:/var/www/
    working_dir: /var/www
    depends_on:
      - db-biblios

  nginx-biblios:
    image: nginx:alpine
    container_name: symfony_nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./app:/var/www/
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-biblios

  db-biblios:
    image: postgres:16
    container_name: symfony_db
    restart: always
    environment:
      POSTGRES_DB: ${SQL_DATABASE}
      POSTGRES_USER: ${SQL_USER}
      POSTGRES_PASSWORD: ${SQL_PASSWORD}
    ports:
      - "${SQL_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: