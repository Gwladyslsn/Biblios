server {
    listen 80;
    server_name localhost;

    # Le root doit pointer sur le dossier public de Symfony
    root /var/www/public;
    index index.php index.html;

    # Log
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Routes principales
    location / {
        # Essaie de servir le fichier directement, sinon passe par index.php
        try_files $uri /index.php$is_args$args;
    }

    # WDT et profiler
    location ~ ^/(_(wdt|profiler)|bundles/) {
        # Ces fichiers sont dans public/
        root /var/www/public;
        allow all;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass php:9000;  # le nom de ton service PHP dans docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param APP_ENV dev;  # s'assure que dev est utilisé
        fastcgi_param APP_DEBUG 1;  # force debug actif
    }

    # Interdire l'accès aux fichiers sensibles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}